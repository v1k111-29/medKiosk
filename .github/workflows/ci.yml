name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medkiosk
          POSTGRES_PASSWORD: medkiosk
          POSTGRES_DB: medkiosk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medkiosk -d medkiosk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql+psycopg://medkiosk:medkiosk@localhost:5432/medkiosk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
      # Base deps only: tests never load DeepFace/TensorFlow (imported lazily by the app).
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (SQLite)
        run: pytest -q
      - name: Pytest (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Alembic upgrade + check (PostgreSQL)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          psql "postgresql://medkiosk:medkiosk@localhost:5432/medkiosk_test" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          alembic check

  frontends:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, staff]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      # Kiosk's vite config targets ../static (served by FastAPI in dev); CI builds into dist.
      - run: npm run build -- --outDir dist --emptyOutDir
