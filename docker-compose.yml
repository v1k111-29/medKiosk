# medKiosk production stack (one on-prem server). See docs/DEPLOY.md.
#
#   cp .env.example .env    # set ENV=prod, JWT_SECRET, KIOSK_DEVICE_KEYS, KIOSK_PROXY_KEY,
#                           # GROQ_API_KEY, POSTGRES_PASSWORD, SEED_DEMO_USERS=false ...
#   docker compose up -d --build
#
# kiosk  -> http://<server>:8080   (patient kiosk screens)
# staff  -> http://<server>:8081   (/queue nurses, /display waiting-room TV, /admin/users)
# The backend and database are not published on the host; nginx in kiosk/staff proxies to it.

name: medkiosk

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medkiosk
      POSTGRES_USER: medkiosk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medkiosk -d medkiosk"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      args:
        INSTALL_FACE: ${INSTALL_FACE:-true}
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env: always the compose database.
      DATABASE_URL: postgresql+psycopg://medkiosk:${POSTGRES_PASSWORD}@db:5432/medkiosk
      # Browsers reach the API through the kiosk/staff nginx (same origin), so CORS is unused;
      # list the public origins anyway for direct API use.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
    volumes:
      - deepface:/data            # ArcFace weights (downloaded on first start)
    depends_on:
      db:
        condition: service_healthy
    # Single worker only: the realtime WebSocket hub is in-process.

  kiosk:
    build: ./frontend
    restart: unless-stopped
    environment:
      KIOSK_PROXY_KEY: ${KIOSK_PROXY_KEY:-}
    ports:
      - "${KIOSK_PORT:-8080}:80"
    depends_on:
      - backend

  staff:
    build: ./staff
    restart: unless-stopped
    ports:
      - "${STAFF_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  deepface:
