# Staff app (nurse queue, display board, admin): serves the SPA and proxies the API + WebSockets.
#
# SPA routes (/queue, /display, /admin/users ...) share prefixes with API routes, so requests are
# split by type: browser page loads (Accept: text/html) get index.html, everything else
# (axios JSON calls) goes to the backend. /ws/* is always proxied with the Upgrade headers.

map $http_accept $is_page_load {
    default 0;
    "~*text/html" 1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Strip JWTs from logged request lines (the staff WebSocket passes ?token=<JWT>).
map $request $redacted_request {
    "~^(?<pre>.*[?&](?:access_)?token=)[^&\s]*(?<post>.*)$" "${pre}[REDACTED]${post}";
    default $request;
}
log_format redacted '$remote_addr - [$time_local] "$redacted_request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

upstream medkiosk_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log redacted;

    root /usr/share/nginx/html;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /ws/ {
        proxy_pass http://medkiosk_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        if ($is_page_load) {
            rewrite ^ /index.html last;
        }
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://medkiosk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
